# ONAI node on a DGX Spark (spark1) — vLLM + Aardant vllm-gateway.
#
# Adapted from ONAI's reference compose (Shriphani, 2026-07-01,
# https://gist.github.com/shriphani/6630e92183a1fadc508249ce952c26aa) for the
# Spark's single GB10 GPU (aarch64, unified memory):
#   - tensor-parallel-size 2 -> 1. One GPU per Spark and no ConnectX link
#     between spark0/spark1, so cross-node TP is not available; a 14B AWQ
#     model (~9 GB of weights) fits on one GB10 with room for KV cache.
#   - gpu-memory-utilization 0.8 -> 0.30. vLLM sizes this against the Spark's
#     ~120 GB unified memory; 0.8 would starve the kazu-inference containers
#     already on spark1. 0.30 ~= 36 GB, which is inside spark1's headroom.
#   - vllm/vllm-openai:nightly -> the spark-arena GB10 image already used by
#     space-heater on spark0/spark1 (arm64, proven on this hardware).
#   - vLLM listens on 8600 and is published so Prometheus (ops.insilica.co,
#     job `onai`) can scrape /metrics over the tailnet. 8000 is reserved for
#     space-heater's router-facing vLLM.
#
# Bring-up: see deploy/README.md. Secrets/paths come from deploy/.env.

services:
  vllm:
    image: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
    container_name: onai-vllm
    restart: unless-stopped
    ipc: host
    gpus: all
    ports:
      - "8600:8600"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      VLLM_SLEEP_WHEN_IDLE: "0"
      SAFETENSORS_FAST_GPU: "1"
    volumes:
      - ${HF_CACHE:-/home/dev/.cache/huggingface}:/root/.cache/huggingface
    command:
      - vllm
      - serve
      - Qwen/Qwen3-14B-AWQ
      - --served-model-name
      - qwen3-14b-awq
      - --host
      - 0.0.0.0
      - --port
      - "8600"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "40960"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEM_UTIL:-0.30}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8600/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5

  # ONAI's gateway. The published image is linux/amd64 ONLY (checked
  # 2026-09-04 via `docker manifest inspect`); the Spark is aarch64. Until
  # ONAI publishes an arm64 build this service needs qemu user emulation
  # (`docker run --privileged --rm tonistiigi/binfmt --install amd64`) and the
  # `platform:` pin below. Emulation is fine for a thin proxy, not for vLLM.
  vllm-gateway:
    image: us-west4-docker.pkg.dev/aardant-489720/aardant-repo/aardant-vllm-gateway:0.0.1
    platform: linux/amd64
    container_name: onai-gateway
    depends_on:
      vllm:
        condition: service_healthy
    restart: on-failure
    environment:
      AARDANT_READY_TIMEOUT_SECONDS: "600"
      AARDANT_READY_GRACE_SECONDS: "2"
      AARDANT_VLLM_GATEWAY_VLLM_ENDPOINT: http://vllm:8600/v1/chat/completions
    volumes:
      - ${GATEWAY_STATE:-/home/dev/okn/gateway-state}:/data/aardant
    # ONAI's reference compose publishes no port for the gateway. If it only
    # dials out to ONAI's network, the GCP relay (terraform/) is unnecessary;
    # if it must accept inbound TCP, add `ports:` here and set
    # terraform var.onai_ports. Open question for ONAI — see README.
